<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<defs>
<filter id="f1" filterUnits="userSpaceOnUse" x="-10" y="-10" width="148" height="148" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="blur"/>
<feOffset in="blur" dy="3" result="dropOff"/><feFlood flood-color="#000000" flood-opacity="0.55"/><feComposite in2="dropOff" operator="in" result="drop"/>
<feOffset in="blur" dx="-3" dy="-3" result="dOff"/><feComposite in="SourceAlpha" in2="dOff" operator="arithmetic" k2="1" k3="-1" result="dMask"/>
<feFlood flood-color="#6F8CC4" flood-opacity="0.65"/><feComposite in2="dMask" operator="in" result="dark"/>
<feOffset in="blur" dx="3" dy="3" result="lOff"/><feComposite in="SourceAlpha" in2="lOff" operator="arithmetic" k2="1" k3="-1" result="lMask"/>
