<feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/><feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="dblur"/><feOffset in="dblur" dy="3" result="dropOff"/><feFlood flood-color="#2B3A7A" flood-opacity="0.3"/><feComposite in2="dropOff" operator="in" result="drop"/>
